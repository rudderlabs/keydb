version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/rudderlabs/*"
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "rudderlabs/*"
    groups:
      actions-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      # The docker ecosystem gets no security updates.
      # The runtime bases skip the cooldown, so a patched Go or trust store lands in the next run.
      exclude:
        - "golang"
        - "alpine"
    groups:
      # golang has its own group: its PR also needs the go line in go.mod, so it must not hold back
      # an alpine trust-store bump. The first matching group wins.
      golang:
        patterns:
          - "golang"
      docker-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
