name: Docker Build (ECR)
on:
  workflow_call:
    inputs:
      image_name:
        description: 'Docker image name suffix (e.g., rudderstack/rudder-keydb)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      aws_ecr_iam_role_arn:
        description: 'AWS ECR IAM Role ARN'
        required: true
        type: string
      aws_ecr_region:
        description: 'AWS ECR Region'
        required: true
        type: string

permissions: {}

env:
  ARCH_AMD64: amd64
  ARCH_ARM64: arm64

jobs:
  docker-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # configure-aws-credentials assumes the ECR role through OIDC
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      build-date: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      revision: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
      tags: ${{ steps.meta.outputs.tags }}
      arm64_tags: ${{ steps.arm64_meta.outputs.tags }}
      arm64_labels: ${{ steps.arm64_meta.outputs.labels }}
      amd64_tags: ${{ steps.amd64_meta.outputs.tags }}
      amd64_labels: ${{ steps.amd64_meta.outputs.labels }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_ecr_iam_role_arn }}
          aws-region: ${{ inputs.aws_ecr_region }}
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}

      - name: Docker arm64 meta
        id: arm64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
          flavor: |
            suffix=-${{ env.ARCH_ARM64 }},onlatest=true

      - name: Docker amd64 meta
        id: amd64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.event_name == 'release' }}
          flavor: |
            suffix=-${{ env.ARCH_AMD64 }},onlatest=true

  docker-build:
    needs: docker-meta
    strategy:
      matrix:
        build-config:
          - os: arc-arm64
            tags: ${{ needs.docker-meta.outputs.arm64_tags }}
            labels: ${{ needs.docker-meta.outputs.arm64_labels }}
            platform: linux/arm64
          - os: ubuntu-latest
            tags: ${{ needs.docker-meta.outputs.amd64_tags }}
            labels: ${{ needs.docker-meta.outputs.amd64_labels }}
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout
      id-token: write # configure-aws-credentials assumes the ECR role through OIDC
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_ecr_iam_role_arn }}
          aws-region: ${{ inputs.aws_ecr_region }}
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build, scan and push
        uses: rudderlabs/build-scan-push-action@c47115e5eab78162efec1b4961cba4063dfd8d5f # v2.4.0
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          platforms: ${{ matrix.build-config.platform }}
          push: true
          tags: ${{ matrix.build-config.tags }}
          labels: ${{ matrix.build-config.labels }}
          build-args: |
            BUILD_DATE=${{ needs.docker-meta.outputs.build-date }}
            VERSION=${{ needs.docker-meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            REVISION=${{ needs.docker-meta.outputs.revision }}

  create-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # configure-aws-credentials assumes the ECR role through OIDC
    needs: [docker-build, docker-meta]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_ecr_iam_role_arn }}
          aws-region: ${{ inputs.aws_ecr_region }}
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Create multi-arch manifest for Docker
        env:
          TAGS: ${{ needs.docker-meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Each staging tag is the consumer tag plus an arch suffix, so the join uses exact names.
          joined=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$tag-${ARCH_ARM64}" "$tag-${ARCH_AMD64}"
            joined=$((joined + 1))
          done <<< "$TAGS"
          [ "$joined" -gt 0 ] || { echo "docker-meta produced no tags" >&2; exit 1; }

