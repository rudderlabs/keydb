name: builds
on:
  release:
    types: [created]
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Push and release runs get a group per run, so none waits on or replaces another. Only PR runs cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # DockerHub builds
  keydb-dockerhub:
    permissions:
      contents: read # actions/checkout in the called workflow
      id-token: write # cosign keyless signing in the called workflow
    uses: ./.github/workflows/docker-build-dockerhub.yml
    with:
      image_name: rudderstack/rudder-keydb
      dockerfile: Dockerfile
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  keydb-scaler-dockerhub:
    permissions:
      contents: read # actions/checkout in the called workflow
      id-token: write # cosign keyless signing in the called workflow
    uses: ./.github/workflows/docker-build-dockerhub.yml
    with:
      image_name: rudderstack/rudder-keydb-scaler
      dockerfile: Dockerfile-scaler
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ECR builds
  keydb-ecr:
    permissions:
      contents: read # actions/checkout in the called workflow
      id-token: write # ECR role through OIDC in the called workflow
    uses: ./.github/workflows/docker-build-ecr.yml
    with:
      image_name: rudderstack/rudder-keydb
      dockerfile: Dockerfile
      aws_ecr_iam_role_arn: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
      aws_ecr_region: ${{ vars.AWS_ECR_REGION }}

  keydb-scaler-ecr:
    permissions:
      contents: read # actions/checkout in the called workflow
      id-token: write # ECR role through OIDC in the called workflow
    uses: ./.github/workflows/docker-build-ecr.yml
    with:
      image_name: rudderstack/rudder-keydb-scaler
      dockerfile: Dockerfile-scaler
      aws_ecr_iam_role_arn: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
      aws_ecr_region: ${{ vars.AWS_ECR_REGION }}
